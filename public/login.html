<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TV Beladona — Entrar</title>
<style>
  :root { --bg:#0f0d10; --card:#1b171c; --line:#2c262e; --gold:#c8a24a; --text:#f2ece4; --muted:#9b9098; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg);
         color:var(--text); display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px;
          width:min(360px,92vw); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
          background:#120f13; color:var(--text); font-size:15px; }
  button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:10px; cursor:pointer;
           background:var(--gold); color:#1a1410; font-weight:700; font-size:15px; }
  .err { color:#e88; font-size:13px; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Botica Beladona · TV</h1>
    <div class="sub">Painel de vídeos das unidades</div>
    <label>Senha</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
<script>
  const f = document.getElementById("f");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }),
    });
    if (r.ok) location.href = "/";
    else err.textContent = "Senha incorreta.";
  });
</script>
</body>
</html>
