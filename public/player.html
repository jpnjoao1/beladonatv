<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TV Beladona — Player</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui,Segoe UI,Roboto,sans-serif; }
  #stage { position:fixed; inset:0; background:#000; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }

  /* Tela de pareamento */
  #pair { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
          background:#0f0d10; color:#f2ece4; text-align:center; padding:5vh 4vw; }
  #pair.show { display:flex; }
  #pair h1 { color:#c8a24a; font-size:3.2vh; margin:0 0 1vh; letter-spacing:1px; }
  #pair p  { color:#9b9098; font-size:2.1vh; margin:.4vh 0; max-width:70vw; }
  #code { font-size:9vh; font-weight:800; letter-spacing:1.2vh; margin:3vh 0; color:#fff;
          border-bottom:.5vh solid #c8a24a; padding:0 2vw 1vh; min-width:40vw; }
  #code .cursor { color:#c8a24a; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0;} }
  .hint { color:#6e656c; font-size:1.8vh; margin-top:3vh; }

  /* Teclado na tela (navegado pelo direcional do controle) */
  #kbd { margin-top:1vh; }
  .kbrow { display:flex; gap:1vh; justify-content:center; margin:.7vh 0; }
  .key { min-width:5.5vh; text-align:center; padding:1.3vh 1.5vh; border:.2vh solid #2c262e;
         border-radius:1vh; font-size:2.4vh; color:#f2ece4; background:#1b171c; }
  .key.wide { min-width:9vh; }
  .key.focus { background:#c8a24a; color:#1a1410; border-color:#c8a24a; font-weight:800;
               box-shadow:0 0 2vh rgba(200,162,74,.6); transform:scale(1.06); }
  .key.ok { color:#c8a24a; }
  .key.ok.focus { color:#1a1410; }

  /* Overlay de status (canto) */
  #status { position:fixed; left:2vh; bottom:2vh; color:#fff; font-size:1.8vh; opacity:0;
            background:rgba(0,0,0,.6); padding:1vh 1.6vh; border-radius:1vh; transition:opacity .3s; max-width:60vw; }
  #status.show { opacity:1; }
  #splash { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            background:#0f0d10; color:#c8a24a; font-size:2.4vh; letter-spacing:2px; }
</style>
</head>
<body>
  <div id="stage">
    <video id="v1" playsinline muted></video>
    <video id="v2" playsinline muted style="display:none"></video>
  </div>

  <div id="splash">BOTICA BELADONA</div>

  <div id="pair">
    <h1>BOTICA BELADONA · TV</h1>
    <p>Primeira configuração desta tela</p>
    <div id="code"><span class="cursor">_</span></div>
    <div id="kbd"></div>
    <p class="hint">Use as <b>setas</b> do controle para mover · <b>OK</b> seleciona · escolha <b>✓ OK</b> para confirmar</p>
  </div>

  <div id="status"></div>

<script>
"use strict";
// =============================================================================
// Player de sinalizacao — roda no navegador (teste) e dentro do APK WebView (Fire TV).
//
// No APK, o Kotlin injeta um objeto `Android` com:
//   Android.isNative() -> true
//   Android.getConfig() -> JSON {device}
//   Android.saveDevice(code)
//   Android.localPathFor(id) -> caminho file:// se o video ja foi baixado, senao ""
//   Android.sync(playlistJson) -> dispara download/limpeza; retorna imediatamente
//   Android.storageFreeMb() -> numero
// e chama window.__remote('up'|'down'|'left'|'right'|'ok'|'back'|'digit:X') para o controle.
//
// No navegador, nada disso existe -> usamos o servidor por streaming (url http) e
// o teclado simula o controle. Assim voce testa tudo no PC antes de comprar o Fire Stick.
// =============================================================================

const NATIVE = !!(window.Android && window.Android.isNative && window.Android.isNative());
// No navegador o servidor é a propria origem; no APK vem da config injetada pelo Kotlin.
let API = location.origin;
if (NATIVE) {
  try { const c = JSON.parse(window.Android.getConfig() || "{}"); if (c.serverUrl) API = c.serverUrl.replace(/\/+$/, ""); } catch (_) {}
}
const POLL_MS = 5 * 60 * 1000;      // re-sincroniza playlist a cada 5 min
const HEARTBEAT_MS = 60 * 1000;     // avisa o painel a cada 1 min
const RETRY_MS = 20 * 1000;

let device = null;
let playlist = [];       // itens vindos do servidor
let idx = 0;
let cur, nxt;            // elementos <video> (double-buffer)
let nowPlayingId = null;

const $ = (id) => document.getElementById(id);
const splash = $("splash");

function showStatus(msg, ms=4000){
  const s=$("status"); s.textContent=msg; s.classList.add("show");
  clearTimeout(showStatus._t); if(ms) showStatus._t=setTimeout(()=>s.classList.remove("show"),ms);
}

// ---------------------------------------------------------------- device config
function loadDevice(){
  if(NATIVE){
    try { const c=JSON.parse(window.Android.getConfig()||"{}"); return c.device||null; } catch { return null; }
  }
  return localStorage.getItem("tv_device");
}
function saveDevice(code){
  device=code;
  if(NATIVE && window.Android.saveDevice) window.Android.saveDevice(code);
  else localStorage.setItem("tv_device", code);
}

// ---------------------------------------------------------------- pareamento
let typed="";
// Teclado na tela — cada item é [rótulo, valor]. DEL apaga, OK confirma.
const KB_ROWS = [
  "ABCDEFGHIJ".split("").map(c=>[c,c]),
  "KLMNOPQRST".split("").map(c=>[c,c]),
  "UVWXYZ0123".split("").map(c=>[c,c]),
  "456789-".split("").map(c=>[c,c]).concat([["⌫","DEL"],["✓ OK","OK"]]),
];
let kbRow=0, kbCol=0;

function showPairing(){
  $("pair").classList.add("show"); splash.style.display="none";
  kbRow=0; kbCol=0; renderCode(); renderKbd();
}
function hidePairing(){ $("pair").classList.remove("show"); }
function renderCode(){ $("code").innerHTML = esc(typed) + '<span class="cursor">_</span>'; }
function esc(t){ return String(t).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }

function renderKbd(){
  const kb=$("kbd"); kb.innerHTML="";
  KB_ROWS.forEach((row,r)=>{
    const rd=document.createElement("div"); rd.className="kbrow";
    row.forEach((item,c)=>{
      const [label,val]=item;
      const key=document.createElement("div");
      let cls="key"; if(val==="OK"){cls+=" ok wide";} if(val==="DEL"){cls+=" wide";}
      if(r===kbRow&&c===kbCol) cls+=" focus";
      key.className=cls; key.textContent=label;
      rd.appendChild(key);
    });
    kb.appendChild(rd);
  });
}
function clampCol(){ if(kbCol>KB_ROWS[kbRow].length-1) kbCol=KB_ROWS[kbRow].length-1; }

function activateKey(){
  const val=KB_ROWS[kbRow][kbCol][1];
  if(val==="DEL"){ typed=typed.slice(0,-1); renderCode(); return; }
  if(val==="OK"){ if(typed.trim().length>=2) finishPairing(); return; }
  typed=(typed+val).slice(0,20); renderCode();
}

function pairingKey(cmd){
  if(cmd==="up"){ kbRow=Math.max(0,kbRow-1); clampCol(); renderKbd(); return; }
  if(cmd==="down"){ kbRow=Math.min(KB_ROWS.length-1,kbRow+1); clampCol(); renderKbd(); return; }
  if(cmd==="left"){ kbCol=Math.max(0,kbCol-1); renderKbd(); return; }
  if(cmd==="right"){ kbCol=Math.min(KB_ROWS[kbRow].length-1,kbCol+1); renderKbd(); return; }
  if(cmd==="ok"){ activateKey(); return; }
  if(cmd==="back"){ typed=typed.slice(0,-1); renderCode(); return; }
  // Atalho: teclado físico / testes no navegador.
  if(cmd&&cmd.startsWith("char:")){ typed=(typed+cmd.slice(5)).toUpperCase().slice(0,20); renderCode(); }
}
async function finishPairing(){
  const code=typed.trim().toUpperCase();
  showStatus("Verificando "+code+"…", 0);
  try{
    const r=await fetch(API+"/api/playlist?device="+encodeURIComponent(code));
    if(r.status===404){ showStatus("Código não cadastrado no painel. Verifique.", 6000); return; }
    saveDevice(code); hidePairing(); showStatus("Tela "+code+" conectada.", 4000);
    startForDevice();  // busca playlist + liga polling/heartbeat
  }catch(e){ showStatus("Sem conexão. Verifique a internet.", 6000); }
}

// ---------------------------------------------------------------- playlist sync
async function fetchPlaylist(){
  const r=await fetch(API+"/api/playlist?device="+encodeURIComponent(device)+"&t="+Date.now());
  if(!r.ok) throw new Error("playlist "+r.status);
  const data=await r.json();
  return data.items||[];
}

function srcFor(item){
  // No APK: usa arquivo local ja baixado; se ainda nao baixou, cai para streaming temporariamente.
  if(NATIVE && window.Android.localPathFor){
    const p=window.Android.localPathFor(item.id);
    if(p) return p; // file://...
  }
  return API + item.url;
}

async function refresh(){
  try{
    const items=await fetchPlaylist();
    playlist=items;
    if(NATIVE && window.Android.sync){
      // manda o Kotlin baixar novos e apagar os que sairam (assincrono)
      try{ window.Android.sync(JSON.stringify(items)); }catch(_){}
    }
    if(!playlist.length){ showStatus("Nenhum vídeo nesta tela ainda.", 0); }
    else { $("status").classList.remove("show"); if(!playing) startPlayback(); }
  }catch(e){
    showStatus("Sem conexão — tocando conteúdo salvo.", 4000);
  }
}

// ---------------------------------------------------------------- reproducao (double-buffer)
let playing=false;
function startPlayback(){
  if(!playlist.length) return;
  splash.style.display="none";
  playing=true; idx=0; cur=$("v1"); nxt=$("v2");
  playIndex(idx);
}

function preload(el, item){
  el.src=srcFor(item); el.load();
}

function playIndex(i){
  if(!playlist.length){ playing=false; return; }
  idx=(i+playlist.length)%playlist.length;
  const item=playlist[idx];
  nowPlayingId=item.id;
  cur.style.display="block"; nxt.style.display="none";
  cur.src=srcFor(item);
  cur.currentTime=0;
  cur.muted=true; // autoplay em TV exige mudo por padrao
  const p=cur.play();
  if(p&&p.catch) p.catch(()=>{ /* alguns webviews exigem gesto; tenta de novo */ setTimeout(()=>cur.play().catch(()=>{}),300); });

  // pre-carrega o proximo
  const next=playlist[(idx+1)%playlist.length];
  if(next) preload(nxt, next);
}

function advance(){
  const tmp=cur; cur=nxt; nxt=tmp;
  playIndex(idx+1);
}

let consecErrors=0;
function wireVideo(el){
  el.addEventListener("playing", ()=>{ if(el===cur) consecErrors=0; });
  el.addEventListener("ended", ()=>{ if(el===cur){ consecErrors=0; advance(); } });
  el.addEventListener("error", ()=>{
    if(el!==cur) return;
    consecErrors++;
    // Se toda a playlist estiver falhando, faz backoff para nao entrar em loop apertado.
    if(consecErrors >= Math.max(1, playlist.length)){
      showStatus("Não foi possível tocar os vídeos. Tentando novamente em instantes…", 0);
      setTimeout(()=>{ consecErrors=0; advance(); }, 15000);
    } else {
      showStatus("Falha ao tocar um vídeo, pulando…", 3000);
      setTimeout(()=>advance(), 800);
    }
  });
}

// ---------------------------------------------------------------- heartbeat
async function heartbeat(){
  if(!device) return;
  const body={ device, nowPlaying:nowPlayingId, appVersion:1,
    storageFreeMb: (NATIVE&&window.Android.storageFreeMb)?window.Android.storageFreeMb():null,
    itemsCached: playlist.length };
  try{ await fetch(API+"/api/heartbeat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }catch(_){}
}

// ---------------------------------------------------------------- controle remoto / teclado
window.__remote=function(cmd){
  if($("pair").classList.contains("show")){ pairingKey(cmd); return; }
  // fora do pareamento: OK mostra status; segurando back nao faz nada (kiosk)
  if(cmd==="ok"){ showStatus((device||"?")+" · "+(playlist.length)+" vídeo(s) · "+(NATIVE?"Fire TV":"navegador"), 4000); }
  if(cmd==="right") advance();
  if(cmd==="left") playIndex(idx-1);
};

// O Kotlin avisa quando termina de baixar arquivos. Se ainda nao ha nada tocando
// (ex.: pareou offline e agora o arquivo local existe), inicia a reproducao.
window.__filesReady=function(){
  if(playlist.length && !playing) startPlayback();
};

// teclado do PC simula o controle (para teste no navegador)
if(!NATIVE){
  window.addEventListener("keydown",(e)=>{
    if($("pair").classList.contains("show")){
      if(/^[a-zA-Z0-9]$/.test(e.key)){ window.__remote("char:"+e.key); return; }
      if(e.key==="Enter"){ window.__remote("ok"); return; }
      if(e.key==="Backspace"){ e.preventDefault(); window.__remote("back"); return; }
      if(e.key==="-"){ window.__remote("right"); return; }
    }
    if(e.key==="ArrowRight") window.__remote("right");
    if(e.key==="ArrowLeft") window.__remote("left");
    if(e.key==="Enter") window.__remote("ok");
  });
}

// ---------------------------------------------------------------- boot
let started=false;
function startForDevice(){
  if(started) return; started=true;
  splash.style.display="flex";
  refresh();
  setInterval(refresh, POLL_MS);
  setInterval(heartbeat, HEARTBEAT_MS);
  setTimeout(heartbeat, 3000);
}

function boot(){
  wireVideo($("v1")); wireVideo($("v2"));
  device=loadDevice();
  if(!device){ showPairing(); return; }
  startForDevice();
}
boot();
</script>
</body>
</html>
