name: Deploy no Fly.io

# Publica automaticamente a cada push na branch principal.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-beladonatv
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: beladonatv
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Cria o app na 1a vez (ignora erro se ja existir).
      - name: Garantir app
        run: flyctl apps create "$APP" || true

      # Define a senha do painel, se voce cadastrou o segredo PANEL_PASSWORD no GitHub.
      - name: Definir senha do painel
        run: |
          if [ -n "${{ secrets.PANEL_PASSWORD }}" ]; then
            flyctl secrets set PANEL_PASSWORD="${{ secrets.PANEL_PASSWORD }}" -a "$APP" --stage
          fi

      # Cria o volume persistente (videos + db.json) na 1a vez.
      - name: Garantir volume
        run: |
          if ! flyctl volumes list -a "$APP" | grep -q tv_data; then
            flyctl volumes create tv_data -a "$APP" -r gru -s 10 -y
          fi

      - name: Deploy
        run: flyctl deploy --remote-only -a "$APP"
